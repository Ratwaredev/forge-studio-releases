name: Release Forge 0.38.2 bundled Godot

on:
  push:
    branches: [hotfix-forge-0381-repack]
    paths:
      - '.github/workflows/release-0382-godot.yml'
      - '.github/hotfix/0.38.2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-0382-godot
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build, validate and publish Forge 0.38.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/hotfix/0.38.2/release.ps1
