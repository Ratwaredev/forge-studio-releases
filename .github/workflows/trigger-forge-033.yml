name: Trigger Forge 0.33 build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-forge-033.yml'

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified Forge release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-forge.yml --repo "${{ github.repository }}"
