name: Bootstrap Forge 0.32.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-031-on-merge.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-controlled-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch controlled Forge 0.32.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run controlled-release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_ref=main \
            -f rollout_percentage=100 \
            -f minimum_supported_version=0.31.0 \
            -f blocked_versions= \
            -f release_notes='Forge 0.32.1: Forge-only navigation, one unified Biblioteca surface, RatLab separated from Forge UI, shared registry preserved internally.'
          echo 'Controlled Forge 0.32.1 release dispatched.'
