name: Bootstrap Forge 0.34.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-031-on-merge.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-controlled-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch controlled Forge 0.34.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run controlled-release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_ref=feat/forge-034-real-workbench \
            -f rollout_percentage=100 \
            -f minimum_supported_version=0.31.0 \
            -f blocked_versions= \
            -f release_notes='Forge 0.34.0: simplified Preview/Code/Terminal workbench, Monaco editing with immutable snapshots, xterm process output, and guarded repair for legacy snapshot checksum metadata. RatLab source remains separated.'
          echo 'Controlled Forge 0.34.0 release dispatched.'
