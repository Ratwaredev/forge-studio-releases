# Builds a release only from the verified clean-source delivery prepared by Ratwaredev/forgestudio.
name: Build and publish Forge Studio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-public-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Fetch verified Forge source snapshot
        id: source
        shell: pwsh
        env:
          FORGE_SOURCE_TOKEN: ${{ secrets.FORGE_SOURCE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FORGE_SOURCE_TOKEN)) {
            throw 'Missing FORGE_SOURCE_TOKEN secret. Configure a read-only token with Contents access to Ratwaredev/forgestudio before building a release.'
          }
          $headers = @{
            Authorization = "Bearer $env:FORGE_SOURCE_TOKEN"
            Accept = 'application/vnd.github.raw+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Forge-Studio-release-builder'
          }
          $sourceBase = 'https://api.github.com/repos/Ratwaredev/forgestudio/contents/.forge-delivery'
          Invoke-WebRequest -Headers $headers -Uri "$sourceBase/chunks/manifest.json?ref=release-source" -OutFile forge-source-manifest.json
          Invoke-WebRequest -Headers $headers -Uri "$sourceBase/forge-studio-public-source.zip?ref=release-source" -OutFile forge-source.zip

          $manifest = Get-Content forge-source-manifest.json -Raw | ConvertFrom-Json
          if ([string]$manifest.encoding -ne 'base64') { throw 'Unexpected Forge source delivery encoding.' }
          if ([string]$manifest.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid Forge source SHA-256 manifest.' }
          if ([string]$manifest.sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Forge source commit manifest.' }

          $actual = (Get-FileHash forge-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne [string]$manifest.sha256) { throw 'Verified Forge source checksum mismatch.' }
          $bytes = (Get-Item forge-source.zip).Length
          if ($bytes -ne [long]$manifest.bytes) { throw "Verified Forge source byte count mismatch: $bytes != $($manifest.bytes)" }

          New-Item -ItemType Directory -Force forge-src | Out-Null
          Expand-Archive -Path forge-source.zip -DestinationPath forge-src -Force
          foreach ($required in @('package.json','package-lock.json','forge-version.json','forge-toolchains.json','scripts/sync-build-version.mjs','scripts/prepare-godot-toolchain.mjs','scripts/verify-release-toolchain.mjs')) {
            if (-not (Test-Path "forge-src/$required")) { throw "Verified Forge source is missing $required" }
          }

          $identity = Get-Content forge-src/forge-version.json -Raw | ConvertFrom-Json
          $package = Get-Content forge-src/package.json -Raw | ConvertFrom-Json
          $version = [string]$identity.version
          if ($identity.releaseReady -ne $true) { throw "Forge $version is not marked releaseReady; no public release will be created." }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Public Forge release requires final semver, got $version" }
          if ([string]$package.version -ne $version) { throw "package.json version does not match forge-version.json ($($package.version) != $version)" }
          if ([string]$manifest.version -ne $version) { throw "Delivery manifest version does not match source ($($manifest.version) != $version)" }

          Write-Host "Verified Forge source loaded · $version · $($manifest.sourceCommit) · $actual"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "sha=$($manifest.sourceCommit)" >> $env:GITHUB_OUTPUT
          "source_sha256=$actual" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-src/package-lock.json

      - name: Synchronize source metadata before npm ci
        working-directory: forge-src
        run: node scripts/sync-build-version.mjs

      - name: Install dependencies
        working-directory: forge-src
        run: npm ci

      - name: Validate Forge source
        working-directory: forge-src
        run: npm test

      - name: Audit runtime dependencies
        working-directory: forge-src
        run: npm audit --omit=dev --audit-level=high

      - name: Verify updater contract
        working-directory: forge-src
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($null -eq $package.dependencies.'electron-updater') { throw 'electron-updater dependency is missing.' }
          $provider = @($package.build.publish)[0]
          if ($provider.provider -ne 'github' -or $provider.owner -ne 'Ratwaredev' -or $provider.repo -ne 'forge-studio-releases') { throw 'Wrong updater repository.' }
          $main = Get-Content desktop/main.cjs -Raw
          foreach ($contract in @('autoUpdater.autoDownload = true','autoUpdater.autoInstallOnAppQuit = true','checkForUpdates()','4 * 60 * 60 * 1_000')) {
            if (-not $main.Contains($contract)) { throw "Missing updater contract: $contract" }
          }
          $control = Get-Content desktop/update-bootstrap.cjs -Raw
          foreach ($contract in @('update-policy.json','VALID_CHANNELS','allowPrerelease','minimumSupportedVersion')) {
            if (-not $control.Contains($contract)) { throw "Missing update-control contract: $contract" }
          }

      - name: Build Windows installer from clean source
        working-directory: forge-src
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never

      - name: Validate local release assets and seed rollout policy
        id: release
        working-directory: forge-src
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerName = "Forge-Studio-Setup-$env:VERSION-x64.exe"
          $installer = "release/$installerName"
          foreach ($file in @($installer,"$installer.blockmap",'release/latest.yml')) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
          }
          $bytes = (Get-Item $installer).Length
          if ($bytes -lt 150MB) { throw "Installer is too small to contain Forge plus verified Godot: $bytes bytes" }
          $latest = Get-Content release/latest.yml -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($env:VERSION))\s*$") { throw 'latest.yml has wrong version.' }
          if ($latest -notmatch [regex]::Escape($installerName)) { throw 'latest.yml does not reference installer.' }
          if ($latest -match '(?m)^stagingPercentage:') { throw 'Canonical initial release feed must not contain staged rollout metadata; use manage-rollout.yml after publication.' }

          $policy = [ordered]@{
            schema = 1
            latestVersion = $env:VERSION
            minimumSupportedVersion = $null
            rolloutPercentage = 100
            blockedVersions = @()
            paused = $false
            feed = 'github-releases'
            repository = '${{ github.repository }}'
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $policy | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release/update-policy.json
          $roundTrip = Get-Content release/update-policy.json -Raw | ConvertFrom-Json
          if ($roundTrip.latestVersion -ne $env:VERSION -or [int]$roundTrip.rolloutPercentage -ne 100 -or $roundTrip.paused -ne $false) {
            throw 'Initial update-policy.json failed round-trip verification.'
          }

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_bytes=$bytes" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Fresh-install smoke before publishing
        working-directory: forge-src
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'forge-release-smoke'
          Remove-Item $install -Recurse -Force -ErrorAction SilentlyContinue
          $installer = (Resolve-Path "release/$env:INSTALLER_NAME").Path
          $proc = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$install" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Forge installer smoke exited $($proc.ExitCode)" }
          $app = Join-Path $install 'resources\app'
          $installedVersion = node -p "require('$($app.Replace('\','/'))/package.json').version"
          if ($installedVersion -ne $env:VERSION) { throw "Installed Forge version mismatch: $installedVersion" }
          foreach ($required in @('forge-version.json','forge-toolchains.json','THIRD_PARTY_NOTICES.md','scripts\verify-release-toolchain.mjs','toolchains\godot\toolchain.json')) {
            if (-not (Test-Path (Join-Path $app $required))) { throw "Installed Forge missing $required" }
          }
          Push-Location $app
          try {
            node scripts/verify-release-toolchain.mjs --require-runtime-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Installed bundled Godot smoke failed.' }
          } finally { Pop-Location }
          Write-Host "FORGE_FRESH_INSTALL_OK $installedVersion"

      - name: Publish release
        working-directory: forge-src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          # Forge Studio $env:TAG

          Canonical Windows release built from verified clean source.

          - Source commit: $env:SOURCE_COMMIT
          - Source archive SHA-256: $env:SOURCE_SHA256
          - Bundled Godot provenance pinned in forge-toolchains.json
          - Fresh-installed Forge and bundled Godot passed runtime smoke before publication
          - Installer: $env:INSTALLER_NAME
          - Update metadata: latest.yml + blockmap + update-policy.json
          - Initial rollout policy: 100%, not paused, no blocked versions
          - Integrity: SHA256SUMS.txt
          "@ | Set-Content -Encoding utf8 release/RELEASE_NOTES.md
          $installer = "release/$env:INSTALLER_NAME"
          $assets = @($installer,"$installer.blockmap",'release/latest.yml','release/SHA256SUMS.txt','release/update-policy.json')
          if (gh release view $env:TAG --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:TAG @assets --repo "${{ github.repository }}" --clobber
            gh release edit $env:TAG --repo "${{ github.repository }}" --title "Forge Studio $env:TAG" --notes-file release/RELEASE_NOTES.md --latest
          } else {
            gh release create $env:TAG @assets --repo "${{ github.repository }}" --target main --title "Forge Studio $env:TAG" --notes-file release/RELEASE_NOTES.md --latest
          }

      - name: Verify public updater feed and rollout policy
        id: verify_public
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          TAG: ${{ steps.source.outputs.tag }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
          EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory verify | Out-Null
          gh release download $env:TAG --repo "${{ github.repository }}" --dir verify
          foreach ($file in @("verify/$env:INSTALLER_NAME","verify/$env:INSTALLER_NAME.blockmap",'verify/latest.yml','verify/SHA256SUMS.txt','verify/update-policy.json')) {
            if (-not (Test-Path $file)) { throw "Published asset missing: $file" }
          }
          $actual = (Get-FileHash "verify/$env:INSTALLER_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = (Get-Content verify/SHA256SUMS.txt -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256 -or $actual -ne $declared) { throw 'Published checksum mismatch.' }
          $latest = Get-Content verify/latest.yml -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($env:VERSION))\s*$") { throw 'Published latest.yml has wrong version.' }
          if ($latest -notmatch [regex]::Escape($env:INSTALLER_NAME)) { throw 'Published latest.yml does not reference installer.' }
          if ($latest -match '(?m)^stagingPercentage:') { throw 'Fresh canonical feed unexpectedly contains staged rollout metadata.' }
          $policy = Get-Content verify/update-policy.json -Raw | ConvertFrom-Json
          if ($policy.schema -ne 1 -or $policy.latestVersion -ne $env:VERSION -or [int]$policy.rolloutPercentage -ne 100 -or $policy.paused -ne $false) {
            throw 'Published update-policy.json is not the canonical initial 100% policy.'
          }
          if (@($policy.blockedVersions).Count -ne 0) { throw 'Fresh canonical release unexpectedly blocks versions.' }
          "verified_sha256=$actual" >> $env:GITHUB_OUTPUT
          "verified_bytes=$((Get-Item "verify/$env:INSTALLER_NAME").Length)" >> $env:GITHUB_OUTPUT

      - name: Record verified release result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
          INSTALLER_BYTES: ${{ steps.verify_public.outputs.verified_bytes }}
          INSTALLER_SHA256: ${{ steps.verify_public.outputs.verified_sha256 }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const filePath = '.release-result.json';
            let branchExists = true;
            try { await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }); }
            catch (error) { if (error.status === 404) branchExists = false; else throw error; }
            if (!branchExists) await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            const payload = {
              version: process.env.RELEASE_VERSION || null,
              tag: process.env.RELEASE_TAG || null,
              status: process.env.JOB_STATUS,
              runId: String(context.runId),
              releaseCommit: context.sha,
              sourceCommit: process.env.SOURCE_SHA || null,
              installer: process.env.INSTALLER_NAME || null,
              installerBytes: Number(process.env.INSTALLER_BYTES || 0),
              sha256: process.env.INSTALLER_SHA256 || null,
              recordedAt: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, branch, sha,
              message: `release: ${payload.status} ${payload.tag || ''}`.trim(),
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
