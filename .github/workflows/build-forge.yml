name: Build and publish Forge Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-forge.yml"

permissions:
  contents: write

concurrency:
  group: forge-public-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Clone private Forge source
        shell: pwsh
        env:
          RATLAB_SOURCE_TOKEN: ${{ secrets.RATLAB_SOURCE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RATLAB_SOURCE_TOKEN)) {
            throw "Missing RATLAB_SOURCE_TOKEN secret."
          }

          $credentials = "x-access-token:$env:RATLAB_SOURCE_TOKEN"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $encoded" `
            clone --depth 1 --branch main `
            https://github.com/Ratwaredev/ratlab.git forge-src

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to clone the private Forge source repository."
          }

          $sourceVersion = node -p "require('./forge-src/package.json').version"
          Write-Host "Forge source cloned. Version: $sourceVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-src/package-lock.json

      - name: Install dependencies
        working-directory: forge-src
        run: npm ci

      - name: Validate Forge
        working-directory: forge-src
        run: npm test

      - name: Build Windows installer
        working-directory: forge-src
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -- --publish never

      - name: Validate updater assets and checksum
        id: release
        working-directory: forge-src
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: $version"
          }

          $installer = "release/Forge-Studio-Setup-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          $latest = "release/latest.yml"

          foreach ($file in @($installer, $blockmap, $latest)) {
            if (-not (Test-Path $file)) {
              throw "Missing release asset: $file"
            }
          }

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Forge-Studio-Setup-$version-x64.exe" |
            Set-Content -Encoding ascii release/SHA256SUMS.txt

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish immutable release
        shell: pwsh
        working-directory: forge-src
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null) {
            throw "Release $env:RELEASE_TAG already exists. Bump package.json first."
          }

          @"
          # Forge Studio $env:RELEASE_TAG

          Stable Windows installer with automatic updates.

          - Installer: Forge-Studio-Setup-$env:VERSION-x64.exe
          - Update metadata: latest.yml
          - Delta metadata: installer blockmap
          - Integrity: SHA256SUMS.txt
          - Source repository: private
          "@ | Set-Content -Encoding utf8 release/RELEASE_NOTES.md

          gh release create $env:RELEASE_TAG `
            "release/Forge-Studio-Setup-$env:VERSION-x64.exe" `
            "release/Forge-Studio-Setup-$env:VERSION-x64.exe.blockmap" `
            "release/latest.yml" `
            "release/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --target main `
            --title "Forge Studio $env:RELEASE_TAG" `
            --notes-file release/RELEASE_NOTES.md `
            --latest

      - name: Verify public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download $env:RELEASE_TAG --repo "${{ github.repository }}" --dir verify

          foreach ($file in @(
            "verify/Forge-Studio-Setup-$env:VERSION-x64.exe",
            "verify/Forge-Studio-Setup-$env:VERSION-x64.exe.blockmap",
            "verify/latest.yml",
            "verify/SHA256SUMS.txt"
          )) {
            if (-not (Test-Path $file)) {
              throw "Published asset missing: $file"
            }
          }

          Push-Location verify
          $expected = (Get-Content SHA256SUMS.txt).Split(' ')[0]
          $actual = (Get-FileHash "Forge-Studio-Setup-$env:VERSION-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Checksum mismatch"
          }
          Pop-Location
