name: Build and publish Forge Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-forge.yml"

permissions:
  contents: write

concurrency:
  group: forge-public-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Clone private Forge source
        shell: pwsh
        env:
          RATLAB_SOURCE_TOKEN: ${{ secrets.RATLAB_SOURCE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RATLAB_SOURCE_TOKEN)) {
            throw "Missing RATLAB_SOURCE_TOKEN secret."
          }

          $credentials = "x-access-token:$env:RATLAB_SOURCE_TOKEN"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $encoded" `
            clone --depth 1 --branch main `
            https://github.com/Ratwaredev/ratlab.git forge-src

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to clone the private Forge source repository."
          }

          $sourceVersion = node -p "require('./forge-src/package.json').version"
          Write-Host "Forge source cloned. Version: $sourceVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-src/package-lock.json

      - name: Install dependencies
        working-directory: forge-src
        run: npm ci

      - name: Validate Forge
        working-directory: forge-src
        run: npm test

      - name: Verify updater implementation
        working-directory: forge-src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.dependencies.'electron-updater' -eq $null) {
            throw "electron-updater dependency is missing."
          }
          $provider = @($package.build.publish)[0]
          if ($provider.provider -ne 'github' -or $provider.owner -ne 'Ratwaredev' -or $provider.repo -ne 'forge-studio-releases') {
            throw "Forge publish provider does not point to Ratwaredev/forge-studio-releases."
          }
          $main = Get-Content desktop/main.cjs -Raw
          foreach ($contract in @(
            'autoUpdater.autoDownload = true',
            'autoUpdater.autoInstallOnAppQuit = true',
            'checkForUpdates()',
            '4 * 60 * 60 * 1_000'
          )) {
            if (-not $main.Contains($contract)) {
              throw "Missing updater contract: $contract"
            }
          }

      - name: Build Windows installer
        working-directory: forge-src
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -- --publish never

      - name: Validate local updater assets and checksum
        id: release
        working-directory: forge-src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: $version"
          }

          $installerName = "Forge-Studio-Setup-$version-x64.exe"
          $installer = "release/$installerName"
          $blockmap = "$installer.blockmap"
          $latest = "release/latest.yml"

          foreach ($file in @($installer, $blockmap, $latest)) {
            if (-not (Test-Path $file)) {
              throw "Missing release asset: $file"
            }
          }

          $installerBytes = (Get-Item $installer).Length
          if ($installerBytes -lt 10MB) {
            throw "Installer is unexpectedly small: $installerBytes bytes"
          }

          $latestText = Get-Content $latest -Raw
          if ($latestText -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "latest.yml does not contain version $version"
          }
          if ($latestText -notmatch [regex]::Escape($installerName)) {
            throw "latest.yml does not reference $installerName"
          }

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -Encoding ascii release/SHA256SUMS.txt

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_bytes=$installerBytes" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish or repair release
        shell: pwsh
        working-directory: forge-src
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          @"
          # Forge Studio $env:RELEASE_TAG

          Stable Windows installer with automatic updates.

          - Installer: Forge-Studio-Setup-$env:VERSION-x64.exe
          - Update metadata: latest.yml
          - Delta metadata: installer blockmap
          - Integrity: SHA256SUMS.txt
          - Source repository: private
          "@ | Set-Content -Encoding utf8 release/RELEASE_NOTES.md

          if (gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:RELEASE_TAG `
              "release/Forge-Studio-Setup-$env:VERSION-x64.exe" `
              "release/Forge-Studio-Setup-$env:VERSION-x64.exe.blockmap" `
              "release/latest.yml" `
              "release/SHA256SUMS.txt" `
              --repo "${{ github.repository }}" `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              "release/Forge-Studio-Setup-$env:VERSION-x64.exe" `
              "release/Forge-Studio-Setup-$env:VERSION-x64.exe.blockmap" `
              "release/latest.yml" `
              "release/SHA256SUMS.txt" `
              --repo "${{ github.repository }}" `
              --target main `
              --title "Forge Studio $env:RELEASE_TAG" `
              --notes-file release/RELEASE_NOTES.md `
              --latest
          }

      - name: Verify public installer and updater feed
        id: verify_public
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
          EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download $env:RELEASE_TAG --repo "${{ github.repository }}" --dir verify

          foreach ($file in @(
            "verify/$env:INSTALLER_NAME",
            "verify/$env:INSTALLER_NAME.blockmap",
            "verify/latest.yml",
            "verify/SHA256SUMS.txt"
          )) {
            if (-not (Test-Path $file)) {
              throw "Published asset missing: $file"
            }
          }

          $installerPath = "verify/$env:INSTALLER_NAME"
          $installerBytes = (Get-Item $installerPath).Length
          if ($installerBytes -lt 10MB) {
            throw "Published installer is unexpectedly small: $installerBytes bytes"
          }

          $actual = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedExpected = (Get-Content verify/SHA256SUMS.txt -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256 -or $actual -ne $publishedExpected) {
            throw "Checksum mismatch"
          }

          $latestText = Get-Content verify/latest.yml -Raw
          if ($latestText -notmatch "(?m)^version:\s*$([regex]::Escape($env:VERSION))\s*$") {
            throw "Published latest.yml has the wrong version."
          }
          if ($latestText -notmatch [regex]::Escape($env:INSTALLER_NAME)) {
            throw "Published latest.yml does not reference the installer."
          }

          "verified_bytes=$installerBytes" >> $env:GITHUB_OUTPUT
          "verified_sha256=$actual" >> $env:GITHUB_OUTPUT
          "download_url=https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$env:INSTALLER_NAME" >> $env:GITHUB_OUTPUT
          "latest_url=https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/latest.yml" >> $env:GITHUB_OUTPUT

      - name: Record verified release result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_NAME: ${{ steps.release.outputs.installer_name }}
          INSTALLER_BYTES: ${{ steps.verify_public.outputs.verified_bytes }}
          INSTALLER_SHA256: ${{ steps.verify_public.outputs.verified_sha256 }}
          DOWNLOAD_URL: ${{ steps.verify_public.outputs.download_url }}
          LATEST_URL: ${{ steps.verify_public.outputs.latest_url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.release-result.json';

            let branchExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              branchExists = false;
            }
            if (!branchExists) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }

            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const payload = {
              version: process.env.RELEASE_VERSION || null,
              tag: process.env.RELEASE_TAG || null,
              status: process.env.JOB_STATUS,
              runId: String(context.runId),
              commit: context.sha,
              installer: process.env.INSTALLER_NAME || null,
              installerBytes: Number(process.env.INSTALLER_BYTES || 0),
              sha256: process.env.INSTALLER_SHA256 || null,
              downloadUrl: process.env.DOWNLOAD_URL || null,
              latestUrl: process.env.LATEST_URL || null,
              updater: {
                provider: 'github',
                repository: `${owner}/${repo}`,
                startupCheckSeconds: 5,
                repeatCheckHours: 4,
                autoDownload: true,
                autoInstallOnQuit: true
              },
              recordedAt: new Date().toISOString()
            };

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: `release: ${payload.status} ${payload.tag || ''}`.trim(),
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });