name: Release Forge 0.38.5 critical project operations

on:
  push:
    branches: [hotfix-forge-0381-repack]
    paths:
      - '.github/workflows/release-0385-critical-ops.yml'
      - '.github/hotfix/0.38.5/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-0385-critical-ops
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build, install-test and publish Forge 0.38.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/hotfix/0.38.5/release.ps1
