          sed -i 's/^          //' bootstrap-cert.pem
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in forge-035-source.tar.gz \
            -out forge-035-source.tar.gz.cms \
            bootstrap-cert.pem
          sha256sum forge-035-source.tar.gz.cms
          ls -lh forge-035-source.tar.gz forge-035-source.tar.gz.cms

      - name: Publish temporary encrypted bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: forge-source-bootstrap-035-20260810
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" forge-035-source.tar.gz.cms \
            --repo "${{ github.repository }}" \
            --title 'Forge 0.35 encrypted source bootstrap (temporary)' \
            --notes 'Temporary encrypted migration bridge. Contains no usable plaintext source without the private migration key.' \
            --prerelease
