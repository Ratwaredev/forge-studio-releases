name: Migrate Forge 0.35 canonical source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-forge-source-035.yml'
      - '.github/scripts/migrate_forge_035.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-source-migration-035
  cancel-in-progress: false

jobs:
  migrate-test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure private source access
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.RATLAB_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo 'Missing RATLAB_SOURCE_TOKEN' >&2; exit 1; }
          credentials="x-access-token:$SOURCE_TOKEN"
          encoded="$(printf '%s' "$credentials" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"

      - name: Clone last verified Forge source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/forge-034-real-workbench https://github.com/Ratwaredev/ratlab.git source
          test "$(node -p "require('./source/package.json').version")" = "0.34.0"

      - name: Convert and validate Forge 0.35
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/migrate_forge_035.py source
          python - <<'PY'
          from pathlib import Path

          p = Path('source/src/shared/forge-clean-replace-035.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assert.equal(state.captures.some((item) => item.projectId === "p1"), false);', 'assert.equal(state.captures.some((item) => item.id === "c1"), false);')
          p.write_text(s, encoding='utf-8')

          p = Path('source/src/shared/ui-contract-v025.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const websiteScript = fs.readFileSync(path.join(root, "website", "script.js"), "utf8");\n', '')
          s = s.replace('  assert.doesNotMatch(websiteScript, /underdocksoporteapp/);\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          cd source
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
          node scripts/visual-check-034.mjs

      - name: Package and encrypt verified source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf forge-035-source.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='release' \
            --exclude='data' \
            --exclude='artifacts' \
            --exclude='workspace' \
            -C source .
          cat > bootstrap-cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
