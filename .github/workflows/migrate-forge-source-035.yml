name: Migrate Forge 0.35 canonical source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-forge-source-035.yml'
      - '.github/scripts/migrate_forge_035.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-source-migration-035
  cancel-in-progress: false

jobs:
  migrate-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure private repository access
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.RATLAB_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo 'Missing RATLAB_SOURCE_TOKEN' >&2; exit 1; }
          credentials="x-access-token:$SOURCE_TOKEN"
          encoded="$(printf '%s' "$credentials" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"

      - name: Clone last verified Forge source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/forge-034-real-workbench https://github.com/Ratwaredev/ratlab.git source
          test "$(node -p "require('./source/package.json').version")" = "0.34.0"

      - name: Convert source to Forge 0.35
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/migrate_forge_035.py source
          cd source
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
          node scripts/visual-check-034.mjs

      - name: Publish verified source to forgestudio migration branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch migration/forge-035-clean-zip https://github.com/Ratwaredev/forgestudio.git target
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'release' \
            --exclude 'data' \
            --exclude 'artifacts' \
            --exclude 'workspace' \
            source/ target/
          cd target
          git config user.name 'forge-release-bot'
          git config user.email 'forge-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git commit -m 'Forge 0.35: canonical source and clean ZIP replacement'
          git push origin HEAD:migration/forge-035-clean-zip
